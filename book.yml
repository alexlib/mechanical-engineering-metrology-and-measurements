# marimo-book configuration.
# See https://marimobook.org/book_yml/ for every field.
#
# `content/` is deliberately flat (chapter-prefixed names rather than
# subdirectories): marimo-book rewrites `../images/` -> `images/` for pages
# one level below `content/`, so a nested layout would leave image links a
# directory too deep.
title: Mechanical Engineering Metrology and Measurements
description: An open-source book on measurement uncertainty for the undergraduate course Mechanical Engineering
  Metrology and Measurements at Tel Aviv University.
authors:
- name: Alex Liberzon
  affiliation: Tel Aviv University
copyright: Licensed CC0 1.0 Universal (public domain dedication).
license: CC0-1.0
# Chapter structure and topic sequencing follow MEGN 300 course materials by
# Adam W. Duran, Colorado School of Mines, used under CC BY 4.0. See the
# Attribution section of content/intro.md for the required credit statement.
repo: https://github.com/alexlib/mechanical-engineering-metrology-and-measurements
branch: master
logo: images/logo.png
favicon: images/favicon.ico
theme:
  palette:
    primary: '#1F4E79'
    accent: '#E07B39'
launch_buttons:
  molab: true
  github: true
  download: true
dependencies:
  mode: env
bibliography:
- references.bib
cite_style: apa
defaults:
  hide_author_line: true
  show_source_link: true
  hide_first_code_cell: true
  suppress_warnings: true

# Gives discrete marimo widgets (`mo.ui.slider` with explicit steps, dropdowns,
# switches) real reactivity without shipping a Python kernel: the notebook is
# re-executed once per value at build time and the results ship as a JSON lookup
# table that a small JS shim swaps on input.
#
# Only `theory-uncertainty_of_a_slope` has a widget today, and it has exactly one
# — multi-widget pages fall back to static in v1, so keep new widgets one-per-page
# or opt those pages into `mode: wasm` instead.
precompute:
  enabled: true
  max_values_per_widget: 30
  max_combinations_per_page: 30
  max_seconds_per_page: 60
  max_bytes_per_page: 10485760

