name: marimo-book GitHub Pages Deploy
on:
  push:
    # Runs on pushes targeting the default branch
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the
# run in-progress and latest queued. However, do NOT cancel in-progress runs
# as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install book and notebook dependencies
        run: uv sync --frozen --all-extras || uv sync

      - name: Cache marimo renders
        uses: actions/cache@v4
        with:
          path: .marimo_book_cache
          key: marimo-book-${{ github.sha }}
          restore-keys: |
            marimo-book-

      - name: Validate book.yml and content
        run: uv run marimo-book check

      # --strict turns broken in-tree links and anchors into build failures.
      # Caching the render cache above keeps this affordable: only notebooks
      # whose source changed are re-executed.
      - name: Build site
        run: uv run marimo-book build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
