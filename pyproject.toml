[project]
name = "mechanical-engineering-metrology-and-measurements"
version = "0.2.0"
description = "An open-source marimo book on Mechanical Engineering Metrology and Measurements, for the undergraduate course at Tel Aviv University"
readme = "README.md"
requires-python = ">=3.11"

# One environment does both jobs: marimo-book renders the site, and the marimo
# exports it runs need the scientific stack. `book.yml` sets
# `dependencies.mode: env`, so notebooks execute against this same venv.
dependencies = [
    "marimo-book>=0.1.5,<0.2",
    "ipython>=8.0",
    "ipywidgets>=8.1.5",
    "marimo>=0.19",
    "matplotlib>=3.10",
    "nbformat>=5.10",
    "numpy>=2.0",
    "pandas>=2.0",
    "plotnine>=0.15",
    "pyyaml>=6.0",
    "scipy>=1.15",
    "seaborn>=0.13",
    "sympy>=1.13",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
